  textSizing: true
  renderMermaid: false
  hyperlinks: always
  tight: true
defaultThinkingLevel: medium
hideThinkingBlock: true
omitThinking: true
modelRoleStorage: global
inlineToolDescriptors: auto
advisor:
  enabled: true
  syncBacklog: "5"
prewalk:
  enabled: true
plan:
  defaultOnStartup: true
goal:
  enabled: false
  statusInFooter: false
title:
  refreshOnReplan: false
tools:
  xdev: false
  xdevDocs: builtins
dev:
  autoqa: false
astGrep:
  enabled: true
security:
  enabled: true
python:
  kernelMode: session
edit:
  mode: hashline
readLineNumbers: true
lsp:
  enabled: false
  formatOnWrite: true