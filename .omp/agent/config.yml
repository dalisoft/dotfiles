modelRoles:
  default: openai-codex/gpt-5.6-sol
symbolPreset: unicode
composer:
  shape: pi
theme:
  dark: titanium
  light: light
setupVersion: 2
statusLine:
  preset: default
  transparent: true
  compactThinkingLevel: true
display:
  showTokenUsage: true
  showTurnTime: true
  cacheMissMarker: true
task:
  showResolvedModelBadge: true
  eager: default
  enableEffort: false
  isolation:
    mode: auto
    commits: generic
tui:
